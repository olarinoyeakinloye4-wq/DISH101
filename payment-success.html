<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status | Dish101</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet"><style>:root{--primary:#E63946;--accent:#F77F00;--dark:#1D1D1F;--cream:#FFF8F0}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--cream);font-family:Poppins,sans-serif;color:var(--dark)}main{width:min(440px,calc(100% - 40px));padding:42px 30px;text-align:center;background:#fff;border-radius:14px;box-shadow:0 16px 45px #1d1d1f20}h1{font:700 2.3rem 'Playfair Display',serif;margin:0 0 12px}p{color:#6d6a69}strong{display:block;color:var(--primary);margin:16px 0}a,button{display:inline-block;border:0;border-radius:5px;background:var(--primary);color:#fff;padding:13px 20px;font:600 1rem Poppins;text-decoration:none;cursor:pointer}</style></head><body><main><p>Dish101</p><h1 id="title">Verifying payment…</h1><p id="message">Please wait while we confirm your payment.</p><strong id="reference"></strong><a id="retry" href="/" hidden>Try again</a></main><script>(async()=>{const reference=new URLSearchParams(location.search).get('reference');const title=document.querySelector('#title'),message=document.querySelector('#message'),referenceElement=document.querySelector('#reference'),retry=document.querySelector('#retry');referenceElement.textContent=reference||'';if(!reference){title.textContent='Payment could not be verified';message.textContent='Your payment reference is missing.';retry.hidden=false;return}try{const response=await fetch(`/.netlify/functions/verify-payment?reference=${encodeURIComponent(reference)}`);const text=await response.text();let result={};try{result=text?JSON.parse(text):{}}catch{}if(!response.ok||result.data?.status!=='paid')throw Error();localStorage.removeItem('dish101-cart');title.textContent='Payment successful';message.textContent='Thank you. Your Dish101 order is confirmed.'}catch{title.textContent='Payment could not be verified';message.textContent='Your payment may still be processing. Please retry shortly.';retry.hidden=false}})()</script></body></html>
